# Verificare la fiecare push: tipuri, lint, teste unitare, build și verificarea
# automată a platformei + aplicației (doar citire, pe compania DEMO).
# Dacă pică, nu face merge în main: producția se publică doar din main.
name: Verificare

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificare-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valori publice (ajung oricum în codul din browser). Cheia secretă nu e folosită aici.
  NEXT_PUBLIC_SUPABASE_URL: https://hrzpowmmbuqihtbkisyu.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rFWXCnGAaTYEPJHQf8bvtA_zmYsqYCo
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verificare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalare
        run: npm ci

      - name: Tipuri (TypeScript)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Teste unitare
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Browser pentru verificarea automată
        run: npx playwright install --with-deps chromium

      - name: Verificare automată (platformă + aplicație, compania demo)
        env:
          E2E_BASE: http://localhost:3000
          E2E_SHOTS: e2e-capturi
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run test:e2e

      - name: Capturi și jurnal server la eșec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verificare-esec
          path: |
            e2e-capturi/
            server.log
          if-no-files-found: ignore
          retention-days: 7
