<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programează o discuție | ElectroField</title>
<meta name="description" content="Programează o discuție despre ElectroField, CRM pentru firme de instalații și echipe de teren din România. Alege o zi și un interval disponibil.">
<link rel="canonical" href="https://www.electrofield.ro/programare">
<meta property="og:title" content="Programează o discuție | ElectroField">
<meta property="og:description" content="Descoperă cum gestionezi lucrările și echipele de teren cu ElectroField.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.electrofield.ro/programare">
<meta property="og:locale" content="ro_RO">
<meta property="og:image" content="https://www.electrofield.ro/marketing/van-dusk.jpg">
<style>
/* = Culori: schimbă-le aici ca să se potrivească cu site-ul = */
:root{--bg:#f4f5f7;--card:#fff;--ink:#101828;--muted:#667085;--line:#e3e7ee;--accent:#f5a400;--ok:#1a7f4b;--err:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.5rem;margin:6px 0 4px}h2{font-size:1.05rem;margin:0 0 10px}
.sub,.muted{color:var(--muted)}.sub{margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.hidden{display:none}
/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{text-transform:capitalize;font-size:1.05rem}
.nav{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:1.3rem;cursor:pointer;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:.8rem;color:var(--muted);padding-bottom:2px}
.day{position:relative;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:9px;font:inherit;color:var(--ink);cursor:pointer;padding:0}
.day.off{background:transparent;border-color:transparent;color:#a7afbd}
.day.open::after{content:"";position:absolute;left:32%;right:32%;bottom:6px;height:3px;border-radius:2px;background:var(--accent)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.day:disabled{cursor:default;opacity:.4}
.day i{position:absolute;top:3px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--ink);font:600 .7rem/17px system-ui;font-style:normal}
.legend{font-size:.82rem;color:var(--muted);margin-top:10px}
/* controale */
.slots{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;min-height:44px;min-width:70px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.booked{background:#fff4d6;border-color:var(--accent);cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-size:.9rem;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.btn{background:var(--accent);color:var(--ink);border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;margin:12px 8px 0 0}
.btn.ghost{background:transparent;border:1px solid var(--line);font-weight:400}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err);padding:6px 10px;margin:0;font-weight:400}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;display:none}
.msg.ok{display:block;background:#e6f6ee;color:var(--ok)}.msg.err{display:block;background:#fdeceb;color:var(--err)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;margin-top:20px;padding:6px 0}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.row .d{width:96px;margin:0}.row input[type=time]{width:auto}.row input[type=checkbox]{width:auto}
.bk{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0}.bk b{display:block}
.dayh{font-weight:600;margin:14px 0 2px}.dayh:first-child{margin-top:0}
details summary{cursor:pointer;font-weight:600}
</style>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="shortcut icon" href="/favicon.ico">
<script defer src="/public-web-analytics.js"></script>
</head>
<body>
<main>

<!--  PARTEA PUBLICĂ  -->
<section id="pub">
  <h1 id="tTitle">Programează o discuție</h1>
  <p class="sub" id="tSub">Alege o zi din calendar, apoi ora. Zilele cu linie galbenă au ore libere.</p>
  <div class="card"><div id="calPub"></div></div>
  <div class="card"><h2 id="slotH">Ora</h2><div class="slots" id="slots"></div></div>
  <div class="card hidden" id="formCard">
    <h2 id="formH">Datele tale</h2>
    <label for="f_name">Nume și firmă</label><input id="f_name" autocomplete="name">
    <label for="f_phone">Telefon</label><input id="f_phone" type="tel" autocomplete="tel">
    <label for="f_email">E-mail pentru confirmare</label><input id="f_email" type="email" autocomplete="email" maxlength="254" required>
    <label for="f_note">Ce vrei să discutăm? (opțional)</label><textarea id="f_note" rows="3"></textarea>
    <button class="btn" id="bookBtn">Confirmă programarea</button>
  </div>
  <div class="msg" id="pubMsg" role="status"></div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* = COMPLETEAZĂ AICI (Supabase > Project Settings > API) = */
const SUPABASE_URL = "https://hrzpowmmbuqihtbkisyu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyenBvd21tYnVxaWh0Ymtpc3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDU1MDAsImV4cCI6MjEwNjEyMTUwMH0.XuGjlMo8DUFTNojNNxOlvhDr6DvpTdO_7CSEW7ifbMQ";
/* ------------------------------------------------------- */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const MONTHS = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
const WD = ["Lu","Ma","Mi","Jo","Vi","Sâ","Du"];
const DAYS = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const DEF = {on:true,from:"09:00",to:"17:00"};
let S = {slot_minutes:30, days_ahead:60, weekly:{0:{...DEF,on:false},1:DEF,2:DEF,3:DEF,4:DEF,5:DEF,6:{...DEF,on:false}}};
let OV = {}, taken = new Set(), BK = {}, bkAll = [];
let month = new Date(); month.setDate(1);
let sel = {pub:null, adm:null}, selSlot = null, edit = null, adminOn = false;

const DEFT = {
  title:"Programează o discuție",
  sub:"Alege o zi din calendar, apoi ora. Zilele cu linie galbenă au ore libere.",
  slotsEmpty:"Ora",
  pickDay:"Alege o zi din calendar.",
  slotsTitle:"Ore libere: {data}",
  noSlots:"Nu mai sunt ore libere în această zi.",
  formTitle:"Datele tale pentru {data}, ora {ora}",
  book:"Confirmă programarea",
  ok:"Programat: {data}, ora {ora}. Te contactăm."
};
const T = () => ({...DEFT, ...((S.weekly && S.weekly._texts) || {})});
const fill = (s,d,t) => String(s).replace(/\{data\}/g, d||"").replace(/\{ora\}/g, t||"");
function applyTexts(){
  const t = T(); $("tTitle").textContent = t.title; $("bookBtn").textContent = t.book;
  $("tSub").textContent = t.sub;
}
const mutedMsg = (box, text) => { const sp = document.createElement("span"); sp.className = "muted"; sp.textContent = text; box.appendChild(sp); };

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const bookingClock = new Intl.DateTimeFormat("en-GB", {
  timeZone:"Europe/Bucharest", year:"numeric", month:"2-digit", day:"2-digit",
  hour:"2-digit", minute:"2-digit", hourCycle:"h23"
});
const bookingParts = instant => Object.fromEntries(bookingClock.formatToParts(instant).map(p => [p.type,p.value]));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const tstr = m => pad(Math.floor(m/60))+":"+pad(m%60);
const fmtTime = d => { const p = bookingParts(d); return p.hour+":"+p.minute; };
const fmtDate = d => DAYS[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()];
const at = (d,t) => {
  const wall = Date.parse(ymd(d)+"T"+t+":00Z");
  const p = bookingParts(new Date(wall));
  const local = Date.parse(p.year+"-"+p.month+"-"+p.day+"T"+p.hour+":"+p.minute+":00Z");
  return new Date(wall - (local - wall));
};
const bookingDate = instant => {
  const p = bookingParts(instant);
  return parse(p.year+"-"+p.month+"-"+p.day);
};
const todayD = () => bookingDate(new Date());
const withBooked = (dt, base) => [...new Set([...base, ...(BK[ymd(dt)]||[]).map(b => fmtTime(new Date(b.slot_start)))])].sort();
const show = (el, cls, text) => { el.className = "msg "+cls; el.textContent = text; };

/* ---------- logica orelor ---------- */
function defaultTimes(d){
  const w = S.weekly[d.getDay()], out = [];
  if (!w || !w.on) return out;
  for (let m = mins(w.from); m + S.slot_minutes <= mins(w.to); m += S.slot_minutes) out.push(tstr(m));
  return out;
}
const timesFor = d => OV[ymd(d)] !== undefined ? OV[ymd(d)] : defaultTimes(d);
const freeFor = d => timesFor(d).map(t => at(d,t)).filter(x => x > new Date() && !taken.has(+x));
function inRange(d){ const t = todayD(); return d >= t && d <= new Date(t.getFullYear(), t.getMonth(), t.getDate()+S.days_ahead); }

/* ---------- date din Supabase ---------- */
async function loadPublicData(){
  try{
    const a = await sb.from("booking_settings").select("*").eq("id",1).single();
    if (a.data) S = {slot_minutes:a.data.slot_minutes, days_ahead:a.data.days_ahead, weekly:a.data.weekly};
    if (a.error) throw a.error;
    const lastDay = todayD();
    lastDay.setDate(lastDay.getDate() + S.days_ahead);
    const b = await sb.from("booking_days").select("*").gte("day", ymd(todayD())).lte("day", ymd(lastDay));
    if (b.error) throw b.error;
    OV = {}; (b.data||[]).forEach(r => OV[r.day] = r.slots);
    const to = new Date(Date.now() + (S.days_ahead+2)*864e5);
    const range = {from_ts:new Date().toISOString(), to_ts:to.toISOString()};
    const occupied = new Set();
    for (let offset = 0; ; offset += 500){
      const c = await sb.rpc("taken_slots", range).range(offset, offset + 499);
      if (c.error) throw c.error;
      for (const slot of c.data||[]) occupied.add(+new Date(slot));
      if ((c.data||[]).length < 500) break;
    }
    taken = occupied;
  }catch(e){
    console.error(e);
    OV = {}; taken = new Set(); S = {...S, days_ahead:0, weekly:{_texts:S.weekly._texts}};
  }
}
/* ---------- calendar (folosit și de public, și de admin) ---------- */
function drawCal(el, mode){
  const y = month.getFullYear(), m = month.getMonth(), n = new Date(y,m+1,0).getDate();
  const lead = (new Date(y,m,1).getDay()+6)%7, today = todayD();
  let h = '<div class="calh"><button class="nav" data-n="-1" aria-label="Luna anterioară">‹</button><b>'+MONTHS[m]+' '+y+'</b><button class="nav" data-n="1" aria-label="Luna următoare">›</button></div><div class="grid">';
  WD.forEach(w => h += '<div class="wd">'+w+'</div>');
  for (let i = 0; i < lead; i++) h += "<div></div>";
  for (let d = 1; d <= n; d++){
    const dt = new Date(y,m,d), k = ymd(dt); let cls = "day", dis = false, extra = "";
    if (mode === "pub"){ const open = inRange(dt) && freeFor(dt).length > 0; dis = !open; cls += open ? " open" : " off"; }
    else { dis = dt < today; cls += timesFor(dt).length ? " open" : " off"; const c = (BK[k]||[]).length; if (c) extra = "<i>"+c+"</i>"; }
    if (k === sel[mode]) cls += " sel";
    if (+dt === +today) cls += " today";
    h += '<button class="'+cls+'" data-k="'+k+'"'+(dis?" disabled":"")+'>'+d+extra+'</button>';
  }
  el.innerHTML = h + "</div>";
  el.querySelectorAll(".nav").forEach(b => b.onclick = () => { month = new Date(y, m+Number(b.dataset.n), 1); redraw(); });
  el.querySelectorAll(".day").forEach(b => b.onclick = () => { sel[mode] = b.dataset.k; if (mode === "pub") selSlot = null; redraw(); });
}
const redraw = () => drawPub();

/* ---------- partea publică ---------- */
function drawPub(){
  applyTexts(); const t = T();
  drawCal($("calPub"), "pub");
  const box = $("slots"); box.innerHTML = "";
  $("formCard").classList.toggle("hidden", !selSlot);
  if (!sel.pub){ $("slotH").textContent = t.slotsEmpty; mutedMsg(box, t.pickDay); return; }
  const d = parse(sel.pub);
  $("slotH").textContent = fill(t.slotsTitle, fmtDate(d));
  const free = freeFor(d);
  if (!free.length) mutedMsg(box, t.noSlots);
  free.forEach(x => {
    const b = document.createElement("button");
    b.className = "chip"+(selSlot === +x ? " on" : ""); b.textContent = fmtTime(x);
    b.onclick = () => { selSlot = +x; drawPub(); $("formCard").scrollIntoView({behavior:"smooth",block:"nearest"}); };
    box.appendChild(b);
  });
  if (selSlot) $("formH").textContent = fill(t.formTitle, fmtDate(d), fmtTime(new Date(selSlot)));
}
$("bookBtn").onclick = async () => {
  const name = $("f_name").value.trim(), phone = $("f_phone").value.trim();
  if (!name || !phone) return show($("pubMsg"),"err","Completează numele și telefonul.");
  const email = $("f_email").value.trim();
  if (!email || !$("f_email").checkValidity()) return show($("pubMsg"),"err","Introdu o adresă de e-mail validă pentru confirmare.");
  $("bookBtn").disabled = true;
  const when = new Date(selSlot);
  try {
    const response = await fetch("/api/programari", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slot_start:when.toISOString(), name, phone, email, note:$("f_note").value.trim()})
    });
    if (response.status === 409){
      show($("pubMsg"),"err","Ora nu mai este disponibilă. Alege altă oră.");
      selSlot = null; await loadPublicData(); drawPub();
      return;
    }
    if (!response.ok) throw new Error("Booking failed");
  } catch {
    show($("pubMsg"),"err","Nu am putut confirma programarea. Verifică disponibilitatea sau sună-ne.");
    return;
  } finally {
    $("bookBtn").disabled = false;
  }
  show($("pubMsg"),"ok", fill(T().ok, fmtDate(bookingDate(when)), fmtTime(when)));
  selSlot = null; await loadPublicData(); drawPub();
};

/* ---------- pornire ---------- */
(async () => {
  await loadPublicData();
  const t = todayD();
  for (let i = 0; i <= S.days_ahead; i++){
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate()+i);
    if (freeFor(d).length){ sel.pub = ymd(d); month = new Date(d.getFullYear(), d.getMonth(), 1); break; }
  }
  drawPub();
})();
</script>

</body>
</html>
